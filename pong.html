<body class="game-page">
  <!--
    PONG GAME PAGE
    ==============
    js/pong.js handles paddle movement, browser opponent movement, collisions, scoring,
    serve state, and canvas rendering.
  -->

  <header class="site-shell topbar">
    <a class="brand" href="index.html"><span class="brand-mark">JA</span><span>Interactive Portfolio</span></a>
    <nav class="topbar-links"><a class="pill" href="index.html">← Lobby</a><a class="pill" href="resume.html">Resume</a><a class="pill" href="snake.html">Snake</a></nav>
  </header>

  <main class="site-shell">
    <section class="game-hero">
      <div>
        <p class="eyebrow">Room 02 · JavaScript mini game</p>
        <h1 class="page-title">Pong</h1>
        <p class="page-copy">You versus the browser. First to 7 wins the round.</p>
      </div>
      <a class="button" href="index.html">Back to lobby</a>
    </section>

    <section class="game-shell">
      <div class="canvas-card">
        <canvas id="pongCanvas" width="960" height="600" aria-label="Pong game canvas"></canvas>
      </div>

      <aside class="game-panel">
        <h2>Game panel</h2>
        <div class="stat-grid">
          <div class="stat"><span>You</span><strong id="playerScore">0</strong></div>
          <div class="stat"><span>Browser</span><strong id="aiScore">0</strong></div>
        </div>

        <p class="game-help">
          Use <kbd>W</kbd> / <kbd>S</kbd> or <kbd>↑</kbd> / <kbd>↓</kbd> to move.
          Press <kbd>Space</kbd> to serve and <kbd>R</kbd> to restart.
        </p>

        <div class="game-buttons">
          <button class="button primary" id="pongServe" type="button">Serve</button>
          <button class="button" id="pongRestart" type="button">Restart match</button>
        </div>

        <div class="game-touch-controls pong-touch-controls" aria-label="Pong touch controls">
          <button class="button" data-pong-dir="up" aria-label="Move paddle up"></button>
          <button class="button" data-pong-dir="down" aria-label="Move paddle down"></button>
        </div>
      </aside>
    </section>
  </main>

  <footer class="site-shell site-footer">created by <strong>Jada Anderson</strong></footer>
  <script src="js/pong.js"></script>
</body>
</html>
