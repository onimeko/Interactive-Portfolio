<body class="game-page">
  <!--
    SNAKE GAME PAGE
    ===============
    js/snake.js draws the game into this canvas and handles movement, collisions, food,
    scoring, pause state, and restart state.
  -->

  <header class="site-shell topbar">
    <a class="brand" href="index.html"><span class="brand-mark">JA</span><span>Interactive Portfolio</span></a>
    <nav class="topbar-links"><a class="pill" href="index.html">← Lobby</a><a class="pill" href="resume.html">Resume</a><a class="pill" href="pong.html">Pong</a></nav>
  </header>

  <main class="site-shell">
    <section class="game-hero">
      <div>
        <p class="eyebrow">Room 01 · JavaScript mini game</p>
        <h1 class="page-title">Snake</h1>
        <p class="page-copy">Eat the glowing data bits, grow longer, and avoid the walls and yourself.</p>
      </div>
      <a class="button" href="index.html">Back to lobby</a>
    </section>

    <section class="game-shell">
      <div class="canvas-card">
        <!-- Canvas width and height define the drawing resolution; CSS handles responsive sizing. -->
        <canvas id="snakeCanvas" width="720" height="720" aria-label="Snake game canvas"></canvas>
      </div>

      <aside class="game-panel">
        <h2>Game panel</h2>
        <div class="stat-grid">
          <div class="stat"><span>Score</span><strong id="snakeScore">0</strong></div>
          <div class="stat"><span>Best</span><strong id="snakeBest">0</strong></div>
        </div>

        <p class="game-help">
          Move with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or the arrow keys.
          Press <kbd>P</kbd> to pause and <kbd>R</kbd> to restart.
        </p>

        <div class="game-buttons">
          <button class="button primary" id="snakeStart" type="button">Start / Restart</button>
          <button class="button" id="snakePause" type="button">Pause</button>
        </div>

        <!-- Touch controls appear on smaller screens. -->
        <div class="game-touch-controls snake-touch-controls" aria-label="Snake touch controls">
          <span></span><button class="button" data-snake-dir="up" aria-label="Move snake up"></button><span></span>
          <button class="button" data-snake-dir="left" aria-label="Move snake left"></button><button class="button" data-snake-dir="down" aria-label="Move snake down"></button><button class="button" data-snake-dir="right" aria-label="Move snake right"></button>
        </div>
      </aside>
    </section>
  </main>

  <footer class="site-shell site-footer">created by <strong>Jada Anderson</strong></footer>
  <script src="js/snake.js"></script>
</body>
</html>
